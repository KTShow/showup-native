# Codemagic CI — builds the ShowUp iOS shell and ships it to TestFlight.
#
# BEFORE the first run, set these up in the Codemagic UI (one-time):
#   1. Connect this Git repo as an application.
#   2. Team settings > Integrations > App Store Connect: add an API key
#      (from App Store Connect > Users and Access > Integrations > App Store Connect API,
#      role "App Manager"). Name the integration exactly: showup-asc-key
#   3. In App Store Connect, create the app record (bundle id com.showuproom.app)
#      so it has an "Apple ID" number, then paste that number into
#      APP_STORE_APPLE_ID below.
#
# After that, every push to main builds a signed .ipa and uploads it to TestFlight.

workflows:
  ios-testflight:
    name: ShowUp iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: showup-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.showuproom.app
      vars:
        BUNDLE_ID: "com.showuproom.app"
        APP_STORE_APPLE_ID: 0000000000   # <-- replace with the app's numeric Apple ID
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Capacitor sync
        script: npx cap sync ios
      - name: CocoaPods install
        script: |
          cd ios/App && pod install
      - name: Set incrementing build number
        script: |
          cd ios/App
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build .ipa
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "ShowUp Beta"
