<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ShowUp</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FBF7F2; color: #C4622D;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; color: #7a6a5c; }
  </style>
</head>
<body>
  <!-- Fallback only. The app normally loads https://showuproom.com via
       capacitor.config.json > server.url. This screen shows only if the
       device is offline at launch or the remote URL is unreachable. -->
  <div class="wrap">
    <h1>ShowUp</h1>
    <p>Couldn&rsquo;t reach the couch. Check your connection and reopen the app.</p>
  </div>
</body>
</html>
